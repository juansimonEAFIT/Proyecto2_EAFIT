databases:
  - name: lunchflow-db
    databaseName: lunchflow
    user: lunchflow_user
    region: ohio
    plan: free

services:
  - type: web
    name: lunchflow-web
    env: python
    region: ohio
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn Proyecto.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lunchflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.0"
