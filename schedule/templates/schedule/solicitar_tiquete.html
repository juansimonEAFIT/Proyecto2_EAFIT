<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar tiquete</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 45%, #93c5fd 100%);
            color: #1e293b;
        }

        .pantalla {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .barra-superior {
            width: 100%;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 34px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
        }

        .logo {
            color: #dc2626;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .acciones-superiores {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .boton-icono,
        .boton-menu {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 16px;
            background: #f8fafc;
            color: #dc2626;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(59, 130, 246, 0.10);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .boton-icono:hover,
        .boton-menu:hover {
            transform: translateY(-2px);
            background: #ffffff;
        }

        .menu-desplegable {
            position: relative;
        }

        .contenido-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 62px;
            min-width: 240px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.14);
            overflow: hidden;
            z-index: 20;
        }

        .contenido-menu.mostrar {
            display: block;
        }

        .contenido-menu a {
            display: block;
            padding: 14px 18px;
            text-decoration: none;
            color: #1e293b;
            font-weight: 500;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .contenido-menu a:hover {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .contenedor-principal {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 560px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 22px;
            padding: 34px 32px;
            box-shadow: 0 20px 50px rgba(59, 130, 246, 0.18);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #dc2626;
            text-align: center;
        }

        .subtitulo {
            text-align: center;
            color: #475569;
            margin-bottom: 24px;
        }

        .mensaje {
            margin-bottom: 18px;
            padding: 14px 16px;
            border-radius: 14px;
            background: #eff6ff;
            border-left: 5px solid #60a5fa;
            color: #1e3a8a;
            font-size: 14px;
            font-weight: 500;
        }

        form p {
            margin: 0 0 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #1e293b;
            font-size: 14px;
            font-weight: 600;
        }

        select,
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            background-color: #f8fafc;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: #60a5fa;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.18);
        }

        .boton {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #93c5fd;
            color: #0f172a;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .boton:hover {
            background: #60a5fa;
            color: white;
        }

        @media (max-width: 900px) {
            .logo {
                font-size: 28px;
            }

            .barra-superior {
                padding: 18px 20px;
            }

            .contenedor {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="pantalla">
        <div class="barra-superior">
            <div class="logo">LunchFlow</div>

            <div class="acciones-superiores">
                <a href="/" class="boton-icono" title="Volver al inicio">⌂</a>

                <div class="menu-desplegable">
                    <button class="boton-menu" id="boton-menu" title="Menú de opciones">⋮</button>
                    <div class="contenido-menu" id="contenido-menu">
                        <a href="/">Inicio</a>
                        <a href="/tiquetes/solicitar/">Pedir tiquete de almuerzo</a>
                        <a href="/empleados/crear/">Registrar empleado</a>
                        <a href="/admin/solicitudes/">Ver solicitudes</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="contenedor-principal">
            <div class="contenedor">
                <h1>Solicitar tiquete</h1>
                <div class="subtitulo">
                    Elige si deseas el tiquete físico o a través de código QR.
                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="mensaje">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    {{ formulario.as_p }}
                    <button type="submit" class="boton">Enviar solicitud</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const botonMenu = document.getElementById("boton-menu");
        const contenidoMenu = document.getElementById("contenido-menu");

        botonMenu.addEventListener("click", function (event) {
            event.stopPropagation();
            contenidoMenu.classList.toggle("mostrar");
        });

        document.addEventListener("click", function (event) {
            if (!contenidoMenu.contains(event.target) && !botonMenu.contains(event.target)) {
                contenidoMenu.classList.remove("mostrar");
            }
        });
    </script>
</body>
</html>
