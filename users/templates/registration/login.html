{% extends 'core/base.html' %}

{% block title %}Iniciar Sesión - LunchFlow{% endblock %}

{% block content %}
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 24px;">
    <div class="admin-card" style="width: 100%; max-width: 440px; padding: 48px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="width: 64px; height: 64px; background: #eff6ff; color: var(--color-azul); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            </div>
            <h1 style="font-size: 28px; font-weight: 700; color: var(--color-oscuro); margin: 0 0 8px 0;">¡Bienvenido de nuevo!</h1>
            <p style="color: var(--color-texto-sutil); font-size: 15px; margin: 0;">Ingresa tus credenciales para continuar.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="admin-input-group">
                <label for="username">Nombre de Usuario</label>
                <input type="text" name="username" id="username" class="admin-input" placeholder="Ej: jsimon" required autofocus>
            </div>
            
            <div class="admin-input-group" style="margin-top: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label for="password" style="margin-bottom: 0;">Contraseña</label>
                    <a href="#" style="font-size: 13px; font-weight: 600; color: var(--color-azul); text-decoration: none;">¿Olvidaste tu contraseña?</a>
                </div>
                <input type="password" name="password" id="password" class="admin-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="admin-btn admin-btn-primary" style="width: 100%; margin-top: 32px; height: 54px; font-size: 16px;">
                Iniciar Sesión
            </button>
        </form>

        <div style="margin-top: 32px; text-align: center; border-top: 1px solid #f1f5f9; padding-top: 24px;">
            <p style="font-size: 14px; color: var(--color-texto-sutil); margin: 0;">
                ¿No tienes una cuenta? <span style="font-weight: 600; color: var(--color-oscuro);">Contacta a soporte</span>
            </p>
        </div>
    </div>
</div>
{% endblock %}
