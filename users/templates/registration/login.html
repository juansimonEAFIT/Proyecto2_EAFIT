{% extends 'core/base.html' %}

{% block title %}Iniciar Sesión - LunchFlow{% endblock %}

{% block content %}
<div class="contenedor">
    <h1 class="titulo-central">Iniciar Sesión</h1>
    <p class="subtitulo">Accede a tu cuenta para gestionar tus tiquetes.</p>


    <form method="post">
        {% csrf_token %}
        <div class="campo">
            <label for="username">Usuario</label>
            <input type="text" name="username" id="username" required autofocus>
        </div>
        <div class="campo" style="margin-top: 15px;">
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" required>
        </div>
        
        <button type="submit" class="boton" style="margin-top: 25px;">Ingresar</button>
    </form>
</div>
{% endblock %}
