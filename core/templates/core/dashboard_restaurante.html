{% extends 'core/base.html' %}

{% block title %}Validar Almuerzos - LunchFlow{% endblock %}

{% block content %}
<div class="res-container">
    <div class="res-header">
        <h1>Validación de Almuerzos</h1>
        <p>Apunta la cámara al código QR del empleado</p>
    </div>

    <!-- Escáner QR -->
    <div class="res-card" style="display: flex; flex-direction: column; gap: 24px;">
        <div id="qr-reader-container">
            <div class="res-scanner-wrapper">
                <div id="qr-reader" style="width: 100%; height: 100%; border-radius: 20px; overflow: hidden; background: #0f172a;"></div>
                <div class="res-scanner-overlay" id="qr-overlay"></div>
            </div>
        </div>

        <div style="display: flex; gap: 12px;">
            <button id="btn-iniciar" onclick="iniciarEscaner()" class="res-btn res-btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                Iniciar Escáner
            </button>
            <button id="btn-detener" onclick="detenerEscaner()" class="res-btn res-btn-danger" style="display: none;">
                Detener
            </button>
        </div>

        <div id="qr-status" style="text-align: center; font-size: 14px; font-weight: 600; color: var(--color-texto-sutil);">
            Cámara inactiva
        </div>
    </div>

    <!-- Resultado del escaneo -->
    <div id="resultado-escaneo" style="display: none;">
        <div class="res-card" id="resultado-card" style="text-align: center; border-width: 2px;">
            <div id="resultado-icono" style="width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 32px; font-weight: 700;"></div>
            <h2 id="resultado-titulo" style="margin: 0 0 8px 0; font-size: 20px;"></h2>
            <p id="resultado-mensaje" style="margin: 0 0 24px 0; font-weight: 500; font-size: 15px;"></p>

            <button onclick="escanearOtro()" class="res-btn res-btn-primary">
                Escanear Siguiente QR
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
    let html5QrCode = null;
    let escaneando = false;

    function iniciarEscaner() {
        if (escaneando) return;

        const btnIniciar = document.getElementById('btn-iniciar');
        const btnDetener = document.getElementById('btn-detener');
        const statusDiv = document.getElementById('qr-status');
        const resultadoDiv = document.getElementById('resultado-escaneo');
        const overlay = document.getElementById('qr-overlay');

        resultadoDiv.style.display = 'none';

        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("qr-reader");
        }

        html5QrCode.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0,
            },
            onQrEscaneado,
            (errorMessage) => { }
        ).then(() => {
            escaneando = true;
            btnIniciar.style.display = 'none';
            btnDetener.style.display = 'flex';
            statusDiv.innerHTML = '<span style="color: #166534;">Buscando código QR...</span>';
            overlay.style.borderColor = 'rgba(255, 255, 255, 0.8)';
        }).catch((err) => {
            statusDiv.innerHTML = '<span style="color: #991b1b;">Error al acceder a la cámara</span>';
            console.error("Error:", err);
        });
    }

    function detenerEscaner() {
        if (html5QrCode && escaneando) {
            html5QrCode.stop().then(() => {
                escaneando = false;
                document.getElementById('btn-iniciar').style.display = 'flex';
                document.getElementById('btn-detener').style.display = 'none';
                document.getElementById('qr-status').innerHTML = 'Cámara inactiva';
                document.getElementById('qr-overlay').style.borderColor = 'rgba(255, 255, 255, 0.5)';
            });
        }
    }

    function obtenerUrlConsumoQr(decodedText) {
        try {
            // Intentar parsear como URL
            let urlEscaneada;
            try {
                urlEscaneada = new URL(decodedText);
            } catch(e) {
                // Si no es una URL completa, intentar como relativa
                urlEscaneada = new URL(decodedText, window.location.origin);
            }
            
            // Flexibilizar el patrón de ruta: solo necesita contener /almuerzo/consumir/UUID
            if (urlEscaneada.pathname.includes('/almuerzo/consumir/')) {
                return `${urlEscaneada.pathname}${urlEscaneada.search}${urlEscaneada.hash}`;
            }
            return null;
        } catch (error) {
            return null;
        }
    }

    function onQrEscaneado(decodedText) {
        if (html5QrCode && escaneando) {
            html5QrCode.stop().then(() => {
                escaneando = false;
                document.getElementById('btn-iniciar').style.display = 'flex';
                document.getElementById('btn-detener').style.display = 'none';
            });
        }

        const urlConsumo = obtenerUrlConsumoQr(decodedText);
        if (urlConsumo) {
            document.getElementById('qr-status').innerHTML = '<span style="color: #1d4ed8;">Procesando...</span>';
            window.location.href = urlConsumo;
        } else {
            mostrarResultado(false, 'QR no válido', 'El código escaneado no corresponde a un empleado de LunchFlow. Leído: ' + decodedText);
        }
    }

    function mostrarResultado(exito, titulo, mensaje) {
        const resultadoDiv = document.getElementById('resultado-escaneo');
        const iconoDiv = document.getElementById('resultado-icono');
        const tituloEl = document.getElementById('resultado-titulo');
        const mensajeEl = document.getElementById('resultado-mensaje');
        const card = document.getElementById('resultado-card');

        if (exito) {
            iconoDiv.style.background = '#dcfce7';
            iconoDiv.style.color = '#166534';
            iconoDiv.textContent = '✓';
            tituloEl.style.color = '#166534';
            mensajeEl.style.color = '#166534';
            card.style.borderColor = '#22c55e';
            card.style.background = '#f0fdf4';
        } else {
            iconoDiv.style.background = '#fee2e2';
            iconoDiv.style.color = '#991b1b';
            iconoDiv.textContent = '✕';
            tituloEl.style.color = '#991b1b';
            mensajeEl.style.color = '#991b1b';
            card.style.borderColor = '#ef4444';
            card.style.background = '#fef2f2';
        }

        tituloEl.textContent = titulo;
        mensajeEl.textContent = mensaje;
        resultadoDiv.style.display = 'block';
    }

    function escanearOtro() {
        document.getElementById('resultado-escaneo').style.display = 'none';
        iniciarEscaner();
    }
</script>
{% endblock %}
