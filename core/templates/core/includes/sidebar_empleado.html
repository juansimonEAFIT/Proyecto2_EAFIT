<aside class="sidebar-empleado">
    <div class="sidebar-perfil" style="margin-bottom: 20px; padding: 0 10px;">
        <span class="nombre"
            style="color: var(--color-oscuro); font-weight: 600; font-size: 16px; display: block; margin-bottom: 4px;">{{ request.user.first_name }} {{ request.user.last_name }}</span>
        <span class="rol"
            style="font-size: 14px; font-weight: 700; color: var(--color-rojo); display: block;">Empleado</span>
    </div>

    <a href="{% url 'inicio' %}" class="{% if request.resolver_match.url_name == 'inicio' %}activo{% endif %}">
        <span>🏠</span> Inicio
    </a>
    
    <a href="{% url 'ver_qr_empleado' %}" class="{% if request.resolver_match.url_name == 'ver_qr_empleado' %}activo{% endif %}">
        <span>📱</span> Mi QR
    </a>

    <a href="{% url 'solicitar_tiquete' %}" class="{% if request.resolver_match.url_name == 'solicitar_tiquete' %}activo{% endif %}">
        <span>🎟️</span> Pedir Tiquete
    </a>


    <a href="{% url 'consultar_estado_cuenta' %}"
        class="{% if request.resolver_match.url_name == 'consultar_estado_cuenta' %}activo{% endif %}">
        <span>📊</span> Consumos
    </a>

    <a href="{% url 'registrar_pago' %}"
        class="{% if request.resolver_match.url_name == 'registrar_pago' %}activo{% endif %}">
        <span>💰</span> Pagos
    </a>


    <div
        style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; gap: 10px;">
        <a href="{% url 'perfil_usuario' %}"
            class="{% if request.resolver_match.url_name == 'perfil_usuario' %}activo{% endif %}">
            <span>👤</span> Perfil
        </a>
        <form action="{% url 'logout' %}" method="post" style="width: 100%;">
            {% csrf_token %}
            <button type="submit" class="btn-quick"
                style="width: 100%; cursor: pointer; background: #fee2e2; color: var(--color-rojo); border: 1px solid #fecaca; font-weight: 700;">
                Cerrar sesión
            </button>
        </form>
    </div>
</aside>
