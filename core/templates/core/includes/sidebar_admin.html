<aside class="sidebar-admin" style="position: sticky; top: 0; height: 100vh;">
    <div class="logo-centralizado">UDP Admin</div>

    <a href="{% url 'inicio' %}#overview" class="tab-link" data-tab="overview">
        <span class="icono-admin">📊</span> Panel General
    </a>

    <a href="{% url 'inicio' %}#solicitudes" class="tab-link" data-tab="solicitudes">
        <span class="icono-admin">🎫</span> Solicitudes
    </a>

    <a href="{% url 'inicio' %}#pagos" class="tab-link" data-tab="pagos">
        <span class="icono-admin">💰</span> Validar Pagos
    </a>

    <a href="{% url 'inicio' %}#inventario" class="tab-link" data-tab="inventario">
        <span class="icono-admin">⚙️</span> Inventario
    </a>

    <a href="{% url 'analytics_overview' %}"
        class="{% if request.resolver_match.url_name == 'analytics_overview' %}activo{% endif %}">
        <span class="icono-admin">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 9l-5 5-2-2-4 4"/></svg>
        </span> Analíticas
    </a>

    <a href="{% url 'inicio' %}#personal" class="tab-link" data-tab="personal">
        <span class="icono-admin">👥</span> Gestión Personal
    </a>

    <div
        style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 10px;">
        <a href="{% url 'perfil_usuario' %}"
            class="{% if request.resolver_match.url_name == 'perfil_usuario' %}activo{% endif %}">
            <span class="icono-admin">👤</span> Mi Perfil
        </a>
        <form action="{% url 'logout' %}" method="post" style="width: 100%;">
            {% csrf_token %}
            <button type="submit"
                style="background: none; border: none; color: #f87171; cursor: pointer; font-family: inherit; font-size: inherit; padding: 12px 16px; width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; font-weight: 500; border-radius: 12px; transition: background 0.2s;">
                <span class="icono-admin">🚪</span> Cerrar Sesión
            </button>
        </form>
    </div>
</aside>
