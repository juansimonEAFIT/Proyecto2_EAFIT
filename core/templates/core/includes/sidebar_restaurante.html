<aside class="sidebar-restaurante">
    <div style="margin-bottom: 24px; padding: 0 8px;">
        <span style="color: white; font-weight: 700; font-size: 16px; display: block; margin-bottom: 2px;">{{ user.get_full_name|default:user.username }}</span>
        <span
            style="font-size: 13px; font-weight: 600; color: var(--color-azul-claro); display: block;">Restaurante</span>
    </div>

    <!-- Omitimos "Inicio" porque Escanear QR ES el inicio -->

    <a href="{% url 'dashboard_restaurante' %}"
        class="{% if request.resolver_match.url_name == 'dashboard_restaurante' or request.resolver_match.url_name == 'inicio' %}activo{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
            <circle cx="12" cy="13" r="3" />
        </svg>
        Escanear QR
    </a>

    <a href="{% url 'historial_consumos_restaurante' %}"
        class="{% if request.resolver_match.url_name == 'historial_consumos_restaurante' %}activo{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
            <path d="M7 2v20" />
            <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
        </svg>
        Consumos
    </a>

    <div
        style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; gap: 8px;">
        <a href="{% url 'perfil_usuario' %}"
            class="{% if request.resolver_match.url_name == 'perfil_usuario' %}activo{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
            Perfil
        </a>
        <form action="{% url 'logout' %}" method="post" style="width: 100%; margin: 0;">
            {% csrf_token %}
            <button type="submit"
                style="width: 100%; padding: 14px 16px; border-radius: 12px; font-weight: 600; font-size: 15px; background: transparent; border: 1px solid rgba(254, 226, 226, 0.2); color: #fca5a5; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; transition: all 0.2s;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Cerrar sesión
            </button>
        </form>
    </div>
</aside>
