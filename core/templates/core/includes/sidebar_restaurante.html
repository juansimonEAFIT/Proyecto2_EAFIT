<aside class="sidebar-empleado">
    <div class="sidebar-perfil" style="margin-bottom: 20px; padding: 0 10px;">
        <span class="nombre" style="color: var(--color-oscuro); font-weight: 600; font-size: 16px; display: block; margin-bottom: 4px;">{{ request.user.first_name }} {{ request.user.last_name }}</span>
        <span class="rol" style="font-size: 14px; font-weight: 700; color: var(--color-rojo); display: block;">Restaurante</span>
    </div>

    <a href="{% url 'inicio' %}" class="{% if request.resolver_match.url_name == 'inicio' %}activo{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Inicio
    </a>

    <a href="{% url 'dashboard_restaurante' %}" class="{% if request.resolver_match.url_name == 'dashboard_restaurante' %}activo{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        Escanear QR
    </a>

    <a href="{% url 'historial_consumos_restaurante' %}" class="{% if request.resolver_match.url_name == 'historial_consumos_restaurante' %}activo{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        Consumos
    </a>

    <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; gap: 10px;">
        <a href="{% url 'perfil_usuario' %}" class="{% if request.resolver_match.url_name == 'perfil_usuario' %}activo{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Perfil
        </a>
        <form action="{% url 'logout' %}" method="post" style="width: 100%;">
            {% csrf_token %}
            <button type="submit" class="btn-quick peligro" style="width: 100%; cursor: pointer; font-weight: 700;">
                Cerrar sesión
            </button>
        </form>
    </div>
</aside>
