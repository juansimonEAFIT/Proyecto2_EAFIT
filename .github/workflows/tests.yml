name: Run tests

on:
  pull_request:
    branches:
      - main # Recordar quitar esta mamada despues por main
      - EGS3D-branch

  push:
    branches:
      - main
      - EGS3D-branch

  workflow_dispatch:

jobs:
  build:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # Explicit timeout

    steps:
      - name: SetMemoryLimits
      - run: ulimit -v 6000000  # Limit virtual memory

      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Start containers
        run: docker compose up -d

      - name: Run tests
        run: docker compose exec web python manage.py test --parallel=1