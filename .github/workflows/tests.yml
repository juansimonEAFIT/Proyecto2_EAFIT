name: Run tests

on:
  pull_request:
    branches: [main, EGS3D-branch]

  push:
    branches: [main, EGS3D-branch]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test --parallel=1