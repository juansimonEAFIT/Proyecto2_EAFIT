<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear empleado</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 45%, #93c5fd 100%);
            padding: 24px;
        }

        .contenedor {
            width: 100%;
            max-width: 560px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border-radius: 22px;
            padding: 34px 32px;
            box-shadow: 0 20px 50px rgba(59, 130, 246, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 28px;
        }

        .insignia {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.4px;
            margin-bottom: 14px;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.15);
        }

        h1 {
            margin: 0;
            font-size: 30px;
            color: #dc2626;
            font-weight: 700;
        }

        .subtitulo {
            margin-top: 8px;
            color: #475569;
            font-size: 14px;
            line-height: 1.5;
        }

        .mensaje {
            margin-bottom: 18px;
            padding: 14px 16px;
            border-radius: 14px;
            background: #eff6ff;
            border-left: 5px solid #60a5fa;
            color: #1e3a8a;
            font-size: 14px;
            font-weight: 500;
        }

        form p {
            margin: 0 0 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #1e293b;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            transition: all 0.25s ease;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #60a5fa;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.18);
        }

        .boton {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #93c5fd;
            color: #0f172a;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.25s ease;
            box-shadow: 0 12px 24px rgba(96, 165, 250, 0.2);
        }

        .boton:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 28px rgba(96, 165, 250, 0.28);
            background: #60a5fa;
            color: white;
        }

        .boton:active {
            transform: translateY(0);
        }

        @media (max-width: 640px) {
            .contenedor {
                padding: 26px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="encabezado">
            <div class="insignia">Gestión de almuerzos</div>
            <h1>Crear empleado</h1>
            <div class="subtitulo">
                Registra un nuevo empleado en el sistema y habilítalo para el servicio de almuerzos.
            </div>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mensaje">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ formulario.as_p }}
            <button type="submit" class="boton">Crear empleado</button>
        </form>
    </div>
</body>
</html>
