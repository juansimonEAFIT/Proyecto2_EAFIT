{% extends 'core/base.html' %}

{% block title %}Iniciar Sesión - LunchFlow{% endblock %}

{% block content %}
<div class="contenedor">
    <h1 class="titulo-central">Iniciar Sesión</h1>
    <p class="subtitulo">Accede a tu cuenta para gestionar tus tiquetes.</p>

    <!-- Mostrar mensajes de error/éxito -->
    {% if messages %}
        {% for message in messages %}
            <div class="mensaje" style="
                background: {% if message.tags == 'error' %}#fee2e2{% else %}#dcfce7{% endif %};
                border-color: {% if message.tags == 'error' %}#ef4444{% else %}#22c55e{% endif %};
                color: {% if message.tags == 'error' %}#991b1b{% else %}#166534{% endif %};
                margin-bottom: 20px;
                padding: 12px 16px;
                border-left: 4px solid;
                border-radius: 4px;
            ">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="campo">
            <label for="username">Usuario</label>
            <input type="text" name="username" id="username" required autofocus>
        </div>
        <div class="campo" style="margin-top: 15px;">
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" required>
        </div>
        
        <button type="submit" class="boton" style="margin-top: 25px;">Ingresar</button>
    </form>
</div>
{% endblock %}
